    post:
      operationId: contractors_create
      tags:
      - contractors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contractor'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Contractor'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Contractor'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contractor'
          description: ''
  /api/contractors/{id}/:
    get:
      operationId: contractors_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 contractor 的 唯一整数值。
        required: true
      tags:
      - contractors
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
