      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEvent'
          description: ''
  /api/events/{id}/rectification-callback/:
    post:
      operationId: events_rectification_callback_create
      description: 整改回调（幂等）：相同幂等键重复上报返回原记录，不重复处理。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 problem event 的 唯一整数值。
        required: true
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RectificationReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RectificationReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RectificationReport'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RectificationReport'
          description: ''
  /api/grids/:
    get:
      operationId: grids_list
      tags:
      - grids
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
