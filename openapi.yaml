        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadGrid'
          description: ''
  /api/grids/{id}/:
    get:
      operationId: grids_retrieve
      parameters:
