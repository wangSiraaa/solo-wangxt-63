          description: ''
  /api/penalties/:
    get:
      operationId: penalties_list
      description: 处罚单元：一笔扣分对应唯一处罚单元，版本链完整可追溯。
      tags:
      - penalties
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PenaltyUnit'
          description: ''
  /api/penalties/{id}/:
    get:
      operationId: penalties_retrieve
      description: 处罚单元：一笔扣分对应唯一处罚单元，版本链完整可追溯。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 penalty unit 的 唯一整数值。
        required: true
      tags:
      - penalties
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenaltyUnit'
          description: ''
  /api/penalties/{id}/approve-review/:
    post:
      operationId: penalties_approve_review_create
      description: 复核通过：锁定当前处罚版本，之后更正只能追加。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 penalty unit 的 唯一整数值。
        required: true
      tags:
      - penalties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePenalty'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovePenalty'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovePenalty'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenaltyUnit'
          description: ''
  /api/penalties/{id}/correct/:
    post:
      operationId: penalties_correct_create
      description: 追加更正版本（历史版本保持不变）。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 penalty unit 的 唯一整数值。
        required: true
      tags:
      - penalties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectPenalty'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CorrectPenalty'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CorrectPenalty'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenaltyUnit'
          description: ''
  /api/photos/:
    get:
      operationId: photos_list
      description: 证据照片。上传即计算精确指纹与感知哈希，并生成疑似重复候选。
      tags:
      - photos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
          description: ''
    post:
      operationId: photos_create
      description: 证据照片。上传即计算精确指纹与感知哈希，并生成疑似重复候选。
      tags:
      - photos
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Photo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Photo'
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
          description: ''
  /api/photos/{id}/:
    get:
      operationId: photos_retrieve
      description: 证据照片。上传即计算精确指纹与感知哈希，并生成疑似重复候选。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 photo 的 唯一整数值。
        required: true
      tags:
      - photos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
          description: ''
  /api/photos/{id}/link/:
    post:
      operationId: photos_link_create
      description: 人工把照片关联到既有事件（位置/时间合理性校验不通过返回 409）。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 photo 的 唯一整数值。
        required: true
      tags:
      - photos
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LinkPhoto'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LinkPhoto'
          application/json:
            schema:
              $ref: '#/components/schemas/LinkPhoto'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
