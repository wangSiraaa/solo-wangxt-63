  /api/contracts/:
    get:
      operationId: contracts_list
      tags:
      - contracts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CleaningContract'
          description: ''
    post:
      operationId: contracts_create
      tags:
      - contracts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleaningContract'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CleaningContract'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CleaningContract'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningContract'
          description: ''
  /api/contracts/{id}/:
    get:
      operationId: contracts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 cleaning contract 的 唯一整数值。
        required: true
      tags:
      - contracts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningContract'
          description: ''
  /api/escalations/run/:
    post:
      operationId: escalations_run_create
      description: 触发一轮逾期升级（基于可注入时钟），返回新追加的处罚版本。
      tags:
      - escalations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationResult'
          description: ''
  /api/events/:
