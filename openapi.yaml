openapi: 3.0.3
info:
  title: 街道环卫考核 API
  version: 1.0.0
  description: 道路网格 / 保洁合同 / 问题事件 / 照片证据 / 疑似重复候选 / 处罚单元。图片感知哈希只生成疑似重复候选，事件关联以位置、时间及人工判断为准；扣分按事件发生时的合同责任区间归属；复核通过锁定处罚版本，更正只能追加。
paths:
  /api/candidates/:
    get:
      operationId: candidates_list
      description: 疑似重复候选：仅提示，合并与否由人工按位置、时间判断。
      tags:
      - candidates
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DuplicateCandidate'
          description: ''
  /api/candidates/{id}/:
    get:
      operationId: candidates_retrieve
      description: 疑似重复候选：仅提示，合并与否由人工按位置、时间判断。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 duplicate candidate 的 唯一整数值。
        required: true
      tags:
      - candidates
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidate'
          description: ''
  /api/candidates/{id}/confirm/:
    post:
      operationId: candidates_confirm_create
      description: 确认两张照片是同一问题：合并事件，多余处罚作废。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 duplicate candidate 的 唯一整数值。
        required: true
      tags:
      - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCandidate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmCandidate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmCandidate'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidate'
          description: ''
  /api/candidates/{id}/reject/:
    post:
      operationId: candidates_reject_create
      description: 确认不是同一问题；误传场景可作废后传照片及其孤立事件。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 duplicate candidate 的 唯一整数值。
        required: true
      tags:
      - candidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCandidate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RejectCandidate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RejectCandidate'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCandidate'
          description: ''
  /api/contractors/:
    get:
      operationId: contractors_list
      tags:
      - contractors
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
